<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storage container preview</title>
    <link rel="stylesheet" href="container.css">
    <script type="module" src="js/container-preview.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Storage container</h1>
        <div class="controls">
          <button id="toggle-lid" type="button" aria-pressed="false">Remove lid</button>
          <button id="toggle-stack" type="button" aria-pressed="false">Stack</button>
        </div>
        <p class="hint">Drag to rotate, scroll to zoom.</p>
      </header>
      <div id="view" class="view" role="img" aria-label="3D model of the storage container"></div>
      <p id="no-webgl" class="message" hidden>The 3D view needs WebGL.</p>
    </main>
  </body>
</html>
